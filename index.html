<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Subway Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      color: #fff;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 780px;
      background: #111;
      box-shadow: 0 0 60px rgba(0,0,0,0.9);
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: absolute; top: 0; left: 0; width: 100%;
      padding: 10px 12px; display: flex; justify-content: space-between;
      align-items: flex-start; pointer-events: none; z-index: 10;
    }
    .hud {
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(255,255,255,0.1);
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .hud span { min-width: 26px; text-align: right; }
    #powerupHud {
      position: absolute; top: 48px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 10; pointer-events: none;
    }
    .power-icon {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; background: rgba(0,0,0,0.55);
      border: 2px solid #FFD700; opacity: 0; transition: opacity 0.2s;
    }
    .power-icon.active { opacity: 1; }
    #startScreen, #gameOverScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(15,20,50,0.94) 0%, rgba(30,15,60,0.96) 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 20; text-align: center; padding: 24px;
    }
    h1 {
      font-size: 2.5rem; margin-bottom: 6px;
      background: linear-gradient(135deg, #FFD700, #FF6B00);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 18px rgba(255,180,0,0.45));
    }
    .subtitle { font-size: 0.95rem; opacity: 0.75; margin-bottom: 26px; line-height: 1.5; }
    button {
      background: linear-gradient(135deg, #FF6B00, #FF9500);
      border: none; color: #fff; font-size: 1.2rem; font-weight: 800;
      padding: 14px 46px; border-radius: 50px; cursor: pointer;
      box-shadow: 0 8px 28px rgba(255,107,0,0.45);
      transition: transform 0.12s;
      letter-spacing: 1px;
    }
    button:active { transform: scale(0.96); }
    .controls-info {
      margin-top: 28px; font-size: 0.85rem; opacity: 0.55; line-height: 1.7;
    }
    #finalScore {
      font-size: 2.8rem; font-weight: 800;
      background: linear-gradient(135deg, #FFD700, #FF9500);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin: 8px 0 4px;
    }
    .high-score-label { font-size: 0.9rem; opacity: 0.7; margin-bottom: 18px; }
    #comboText {
      position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%);
      font-size: 2rem; font-weight: 900; color: #FFD700;
      text-shadow: 0 0 18px rgba(255,215,0,0.85); opacity: 0;
      pointer-events: none; z-index: 15; transition: opacity 0.15s;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
      <div class="hud">🪙 <span id="coins">0</span></div>
      <div class="hud">🏆 <span id="best">0</span></div>
      <div class="hud">📏 <span id="distance">0</span>m</div>
    </div>

    <div id="powerupHud">
      <div class="power-icon" id="iconMagnet">🧲</div>
      <div class="power-icon" id="iconShield">🛡️</div>
      <div class="power-icon" id="iconSpeed">⚡</div>
    </div>

    <div id="comboText">COMBO x2</div>

    <div id="startScreen">
      <h1>SUBWAY RUNNER</h1>
      <p class="subtitle">Desvie dos trens • Colete moedas<br>Pegue power-ups e bata seu recorde!</p>
      <button onclick="startGame()">JOGAR</button>
      <div class="controls-info">
        ← → ou A/D — mudar de faixa<br>
        ↑ / Espaço / W — pular<br>
        ↓ / S — deslizar<br>
        (ou deslize o dedo no celular)
      </div>
    </div>

    <div id="gameOverScreen" style="display:none">
      <h1>GAME OVER</h1>
      <div id="finalScore">0</div>
      <p class="high-score-label">metros • Melhor: <span id="finalBest">0</span>m</p>
      <button onclick="startGame()">JOGAR DE NOVO</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const coinsEl = document.getElementById('coins');
    const distanceEl = document.getElementById('distance');
    const bestEl = document.getElementById('best');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('finalScore');
    const finalBestEl = document.getElementById('finalBest');
    const comboText = document.getElementById('comboText');
    const iconMagnet = document.getElementById('iconMagnet');
    const iconShield = document.getElementById('iconShield');
    const iconSpeed = document.getElementById('iconSpeed');

    let W, H, laneW;
    function resize() {
      const c = document.getElementById('gameContainer');
      canvas.width = c.clientWidth;
      canvas.height = c.clientHeight;
      W = canvas.width;
      H = canvas.height;
      laneW = W / 3;
    }
    resize();
    window.addEventListener('resize', resize);

    let player, obstacles = [], coins = [], powerups = [], particles = [], buildings = [], palms = [];
    let score = 0, distance = 0, best = +localStorage.getItem('sr_best') || 0;
    let speed = 7.5, baseSpeed = 7.5, gameRunning = false, animId;
    let lastObs = 0, lastCoin = 0, lastPower = 0, bgOffset = 0;
    let combo = 0, comboTimer = 0, shake = 0;
    let magnetTimer = 0, shieldTimer = 0, speedTimer = 0;
    bestEl.textContent = best;

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx;
    function ensureAudio() { if (!actx) actx = new AudioCtx(); }
    function beep(freq, dur, type = 'square', vol = 0.08) {
      if (!actx) return;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    }
    function sfxCoin() { beep(900, 0.07, 'sine', 0.09); setTimeout(() => beep(1300, 0.07, 'sine', 0.07), 45); }
    function sfxJump() { beep(320, 0.1, 'triangle', 0.06); }
    function sfxSlide() { beep(160, 0.1, 'sawtooth', 0.04); }
    function sfxPower() { beep(540, 0.14, 'sine', 0.09); setTimeout(() => beep(820, 0.18, 'sine', 0.07), 70); }
    function sfxHit() { beep(70, 0.28, 'sawtooth', 0.14); }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function rand(a, b) { return a + Math.random() * (b - a); }

    function zToY(z) { return H * 0.32 + z * H * 0.68; }
    function zToScale(z) { return 0.18 + z * 1.05; }
    function laneX(lane, z) {
      const scale = zToScale(z);
      return W / 2 + (lane - 1) * laneW * 0.82 * scale;
    }

    class Player {
      constructor() {
        this.lane = 1; this.targetLane = 1;
        this.x = W / 2; this.z = 0.88;
        this.yOff = 0; this.vy = 0;
        this.jumping = false; this.sliding = false; this.slideTimer = 0;
        this.w = 42; this.h = 68;
        this.frame = 0;
      }
      update() {
        this.x = lerp(this.x, laneX(this.targetLane, this.z), 0.24);
        this.frame += 0.25;
        if (this.jumping) {
          this.yOff += this.vy;
          this.vy += 1.15;
          if (this.yOff >= 0) { this.yOff = 0; this.jumping = false; this.vy = 0; }
        }
        if (this.sliding) {
          this.slideTimer--;
          if (this.slideTimer <= 0) this.sliding = false;
        }
      }
      jump() {
        if (!this.jumping && !this.sliding) { this.jumping = true; this.vy = -15.5; sfxJump(); }
      }
      slide() {
        if (!this.jumping && !this.sliding) { this.sliding = true; this.slideTimer = 26; sfxSlide(); }
      }
      moveLeft() { if (this.targetLane > 0) this.targetLane--; }
      moveRight() { if (this.targetLane < 2) this.targetLane++; }

      draw() {
        const s = zToScale(this.z);
        const baseY = zToY(this.z);
        const y = baseY + this.yOff - (this.sliding ? 16 : 0);
        const w = this.w * s;
        const h = (this.sliding ? this.h * 0.5 : this.h) * s;
        const x = this.x;

        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(x, baseY + 6, w * 0.5, 6 * s, 0, 0, Math.PI * 2);
        ctx.fill();

        const bodyTop = y - h;

        if (!this.sliding) {
          const legOff = Math.sin(this.frame) * 3 * s;
          ctx.fillStyle = '#222';
          ctx.fillRect(x - 11 * s, y - 14 * s + legOff, 8 * s, 12 * s);
          ctx.fillRect(x + 3 * s, y - 14 * s - legOff, 8 * s, 12 * s);
          ctx.fillStyle = '#FFD600';
          roundRect(x - 13 * s, y - 5 * s + legOff, 12 * s, 7 * s, 3 * s); ctx.fill();
          roundRect(x + 1 * s, y - 5 * s - legOff, 12 * s, 7 * s, 3 * s); ctx.fill();
        } else {
          ctx.fillStyle = '#FFD600';
          roundRect(x - 16 * s, y - 8 * s, 32 * s, 8 * s, 3 * s); ctx.fill();
        }

        const bodyColor = shieldTimer > 0 ? '#81D4FA' : '#FFF8E7';
        ctx.fillStyle = bodyColor;
        roundRect(x - w * 0.38, bodyTop + 18 * s, w * 0.76, h * 0.55, 8 * s);
        ctx.fill();

        ctx.fillStyle = '#FF6D00';
        roundRect(x + w * 0.22, bodyTop + 22 * s, w * 0.28, h * 0.35, 5 * s);
        ctx.fill();
        ctx.fillStyle = '#E65100';
        ctx.fillRect(x + w * 0.28, bodyTop + 28 * s, w * 0.16, 4 * s);

        ctx.fillStyle = '#FFCC80';
        ctx.beginPath();
        ctx.arc(x, bodyTop + 14 * s, 13 * s, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#E53935';
        ctx.beginPath();
        ctx.ellipse(x, bodyTop + 6 * s, 14 * s, 9 * s, 0, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = '#C62828';
        ctx.fillRect(x - 14 * s, bodyTop + 5 * s, 28 * s, 5 * s);
        ctx.fillStyle = '#E53935';
        ctx.beginPath();
        ctx.arc(x, bodyTop - 2 * s, 5 * s, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(x - 5 * s, bodyTop + 13 * s, 2.6 * s, 0, Math.PI * 2);
        ctx.arc(x + 5 * s, bodyTop + 13 * s, 2.6 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#E65100';
        ctx.lineWidth = 1.5 * s;
        ctx.beginPath();
        ctx.arc(x, bodyTop + 16 * s, 5 * s, 0.15, Math.PI - 0.15);
        ctx.stroke();

        ctx.fillStyle = bodyColor;
        const armSwing = Math.sin(this.frame) * 4 * s;
        ctx.fillRect(x - w * 0.5, bodyTop + 26 * s + armSwing, 7 * s, 16 * s);
        ctx.fillRect(x + w * 0.32, bodyTop + 26 * s - armSwing, 7 * s, 16 * s);

        if (shieldTimer > 0) {
          ctx.strokeStyle = 'rgba(100,200,255,0.7)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(x, bodyTop + h * 0.4, Math.max(w, h) * 0.65, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    class Obstacle {
      constructor(lane) {
        this.lane = lane;
        this.z = 0;
        this.type = Math.random() > 0.42 ? 'train' : 'barrier';
        this.hBase = this.type === 'train' ? rand(95, 140) : rand(42, 60);
        this.color = this.type === 'train'
          ? ['#1565C0', '#C62828', '#6A1B9A', '#2E7D32'][Math.floor(Math.random() * 4)]
          : '#5D4037';
      }
      update() { this.z += speed * 0.0043; }
      get y() { return zToY(this.z); }
      get scale() { return zToScale(this.z); }
      get x() { return laneX(this.lane, this.z); }

      draw() {
        if (this.z > 1.15) return;
        const s = this.scale;
        const w = (this.type === 'train' ? 72 : 52) * s;
        const h = this.hBase * s;
        const x = this.x - w / 2;
        const y = this.y - h;

        if (this.type === 'train') {
          ctx.fillStyle = this.color;
          roundRect(x, y, w, h, 7 * s); ctx.fill();
          ctx.fillStyle = 'rgba(0,0,0,0.25)';
          ctx.fillRect(x, y, w, 10 * s);
          ctx.fillStyle = '#B3E5FC';
          const rows = Math.min(4, Math.floor(h / (24 * s)));
          for (let i = 0; i < rows; i++) {
            roundRect(x + 9 * s, y + 14 * s + i * 24 * s, w - 18 * s, 15 * s, 3 * s);
            ctx.fill();
          }
          ctx.fillStyle = '#FFD600';
          ctx.fillRect(x, y + h - 11 * s, w, 9 * s);
          ctx.fillStyle = '#212121';
          ctx.beginPath();
          ctx.arc(x + 16 * s, y + h + 3, 8 * s, 0, Math.PI * 2);
          ctx.arc(x + w - 16 * s, y + h + 3, 8 * s, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#757575';
          ctx.beginPath();
          ctx.arc(x + 16 * s, y + h + 3, 3.5 * s, 0, Math.PI * 2);
          ctx.arc(x + w - 16 * s, y + h + 3, 3.5 * s, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#6D4C41';
          roundRect(x, y, w, h, 4 * s); ctx.fill();
          ctx.fillStyle = '#FFD600';
          for (let i = 0; i < 3; i++) {
            ctx.fillRect(x + 5 * s, y + 7 * s + i * 15 * s, w - 10 * s, 6 * s);
          }
          ctx.fillStyle = '#4E342E';
          ctx.fillRect(x - 4 * s, y + h * 0.3, 6 * s, h * 0.7);
          ctx.fillRect(x + w - 2 * s, y + h * 0.3, 6 * s, h * 0.7);
        }
      }
    }

    class Coin {
      constructor(lane) {
        this.lane = lane; this.z = 0;
        this.r = 12; this.rot = Math.random() * 6;
      }
      update() {
        this.z += speed * 0.0043;
        this.rot += 0.13;
        if (magnetTimer > 0 && player) {
          if (Math.abs(player.z - this.z) < 0.38) {
            this.lane = lerp(this.lane, player.targetLane, 0.18);
            this.z = lerp(this.z, player.z, 0.14);
          }
        }
      }
      draw() {
        if (this.z > 1.1) return;
        const s = zToScale(this.z);
        const x = laneX(this.lane, this.z);
        const y = zToY(this.z) - 28 * s;
        const r = this.r * s;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(this.rot);
        ctx.fillStyle = '#FFC107';
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFE082';
        ctx.beginPath(); ctx.arc(-r * 0.28, -r * 0.28, r * 0.32, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#FF8F00';
        ctx.lineWidth = 2 * s;
        ctx.beginPath(); ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#FF8F00';
        ctx.font = 'bold ' + Math.max(9, 13 * s) + 'px Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('$', 0, 1);
        ctx.restore();
      }
    }

    class PowerUp {
      constructor(lane) {
        this.lane = lane; this.z = 0;
        this.type = ['magnet', 'shield', 'speed'][Math.floor(Math.random() * 3)];
        this.bob = Math.random() * 6;
      }
      update() { this.z += speed * 0.0043; this.bob += 0.14; }
      draw() {
        if (this.z > 1.1) return;
        const s = zToScale(this.z);
        const x = laneX(this.lane, this.z);
        const y = zToY(this.z) - 38 * s + Math.sin(this.bob) * 7;
        const r = 15 * s;
        const colors = { magnet: '#E040FB', shield: '#29B6F6', speed: '#FFEE58' };
        const icons = { magnet: '🧲', shield: '🛡️', speed: '⚡' };
        ctx.fillStyle = colors[this.type];
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.35, 0, Math.PI * 2); ctx.fill();
        ctx.font = Math.max(11, 16 * s) + 'px Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(icons[this.type], x, y + 1);
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y;
        this.vx = rand(-5, 5); this.vy = rand(-9, -2);
        this.life = 1; this.color = color; this.size = rand(3, 7);
      }
      update() { this.x += this.vx; this.y += this.vy; this.vy += 0.28; this.life -= 0.036; }
      draw() {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    class Building {
      constructor(side) {
        this.side = side;
        this.z = Math.random();
        this.h = rand(90, 230);
        this.w = rand(45, 80);
        this.hue = rand(0, 360);
        this.sat = rand(40, 70);
        this.light = rand(35, 55);
        this.windows = Math.floor(rand(4, 8));
      }
      update() {
        this.z += speed * 0.0036;
        if (this.z > 1.25) {
          this.z = -0.15;
          this.h = rand(90, 240);
          this.w = rand(45, 85);
          this.hue = rand(0, 360);
        }
      }
      draw() {
        if (this.z < -0.05 || this.z > 1.15) return;
        const s = zToScale(this.z) * 0.95;
        const y = zToY(this.z);
        const xBase = this.side < 0 ? W * 0.06 : W * 0.94;
        const x = xBase + this.side * (18 * s);
        const bw = this.w * s, bh = this.h * s;
        ctx.fillStyle = 'hsl(' + this.hue + ', ' + this.sat + '%, ' + this.light + '%)';
        ctx.fillRect(x - bw / 2, y - bh, bw, bh);
        ctx.fillStyle = 'hsl(' + this.hue + ', ' + this.sat + '%, ' + (this.light - 12) + '%)';
        ctx.fillRect(x - bw / 2 - 3 * s, y - bh - 6 * s, bw + 6 * s, 8 * s);
        ctx.fillStyle = 'rgba(255, 240, 150, 0.55)';
        for (let r = 0; r < this.windows; r++) {
          for (let c = 0; c < 2; c++) {
            const wx = x - bw / 2 + 8 * s + c * (bw * 0.45);
            const wy = y - bh + 12 * s + r * (bh / this.windows);
            ctx.fillRect(wx, wy, 7 * s, 9 * s);
          }
        }
      }
    }

    class Palm {
      constructor(side) {
        this.side = side;
        this.z = Math.random();
        this.h = rand(60, 120);
      }
      update() {
        this.z += speed * 0.0036;
        if (this.z > 1.25) { this.z = -0.1; this.h = rand(60, 130); }
      }
      draw() {
        if (this.z < 0 || this.z > 1.1) return;
        const s = zToScale(this.z) * 0.9;
        const y = zToY(this.z);
        const x = this.side < 0 ? W * 0.12 + this.side * 10 * s : W * 0.88 + this.side * 10 * s;
        const trunkH = this.h * s;
        ctx.strokeStyle = '#6D4C41';
        ctx.lineWidth = 5 * s;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + this.side * 8 * s, y - trunkH * 0.5, x, y - trunkH);
        ctx.stroke();
        ctx.fillStyle = '#43A047';
        for (let i = 0; i < 5; i++) {
          const ang = -1.2 + i * 0.6;
          ctx.beginPath();
          ctx.ellipse(x + Math.cos(ang) * 18 * s, y - trunkH + Math.sin(ang) * 6 * s, 20 * s, 6 * s, ang, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#2E7D32';
        ctx.beginPath();
        ctx.arc(x, y - trunkH, 6 * s, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawSky() {
      const g = ctx.createLinearGradient(0, 0, 0, H * 0.38);
      g.addColorStop(0, '#4FC3F7');
      g.addColorStop(0.55, '#81D4FA');
      g.addColorStop(1, '#E1F5FE');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H * 0.38);
      ctx.fillStyle = '#FFF59D';
      ctx.beginPath();
      ctx.arc(W * 0.82, H * 0.1, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,245,157,0.25)';
      ctx.beginPath();
      ctx.arc(W * 0.82, H * 0.1, 42, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawTracks() {
      const horizon = H * 0.32;

      ctx.fillStyle = '#66BB6A';
      ctx.beginPath();
      ctx.moveTo(0, horizon);
      ctx.lineTo(W * 0.2, H);
      ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(W, horizon);
      ctx.lineTo(W * 0.8, H);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();

      const bedGrad = ctx.createLinearGradient(0, horizon, 0, H);
      bedGrad.addColorStop(0, '#8D6E63');
      bedGrad.addColorStop(1, '#5D4037');
      ctx.fillStyle = bedGrad;
      ctx.beginPath();
      ctx.moveTo(W * 0.32, horizon);
      ctx.lineTo(W * 0.68, horizon);
      ctx.lineTo(W * 0.98, H);
      ctx.lineTo(W * 0.02, H);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([16, 20]);
      ctx.beginPath();
      ctx.moveTo(W * 0.41, horizon);
      ctx.lineTo(W * 0.30, H);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(W * 0.59, horizon);
      ctx.lineTo(W * 0.70, H);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = '#B0BEC5';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      for (let lane = 0; lane < 3; lane++) {
        const t0 = (lane + 0.15) / 3;
        const t1 = (lane + 0.85) / 3;
        const l0 = lerp(W * 0.32, W * 0.68, t0);
        const r0 = lerp(W * 0.32, W * 0.68, t1);
        const l1 = lerp(W * 0.02, W * 0.98, t0);
        const r1 = lerp(W * 0.02, W * 0.98, t1);
        ctx.beginPath();
        ctx.moveTo(l0, horizon);
        ctx.lineTo(l1, H);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(r0, horizon);
        ctx.lineTo(r1, H);
        ctx.stroke();
      }

      ctx.fillStyle = '#4E342E';
      const spacing = 0.042;
      const off = (bgOffset * 0.0042) % spacing;
      for (let z = off; z < 1.05; z += spacing) {
        const y = zToY(z);
        const s = zToScale(z);
        const left = lerp(W * 0.32, W * 0.02, z);
        const right = lerp(W * 0.68, W * 0.98, z);
        const sw = 6 * s;
        ctx.fillRect(left + 6, y - sw * 0.3, right - left - 12, sw);
      }
    }

    function spawnObstacle() {
      const used = obstacles.filter(o => o.z < 0.22).map(o => o.lane);
      let lane;
      do { lane = Math.floor(Math.random() * 3); } while (used.includes(lane) && used.length < 2);
      obstacles.push(new Obstacle(lane));
    }

    function update() {
      if (!gameRunning) return;
      distance += speed * 0.12;
      bgOffset += speed;

      baseSpeed = 7.5 + Math.min(9, Math.floor(distance / 170));
      speed = speedTimer > 0 ? baseSpeed * 1.35 : baseSpeed;

      if (magnetTimer > 0) magnetTimer--;
      if (shieldTimer > 0) shieldTimer--;
      if (speedTimer > 0) speedTimer--;
      if (comboTimer > 0) comboTimer--; else combo = 0;
      if (shake > 0) shake *= 0.84;

      iconMagnet.classList.toggle('active', magnetTimer > 0);
      iconShield.classList.toggle('active', shieldTimer > 0);
      iconSpeed.classList.toggle('active', speedTimer > 0);

      player.update();
      buildings.forEach(b => b.update());
      palms.forEach(p => p.update());

      const now = performance.now();
      if (now - lastObs > Math.max(400, 880 - distance * 0.42)) {
        spawnObstacle(); lastObs = now;
      }
      if (now - lastCoin > 450) {
        coins.push(new Coin(Math.floor(Math.random() * 3))); lastCoin = now;
      }
      if (now - lastPower > 6200 && distance > 70) {
        powerups.push(new PowerUp(Math.floor(Math.random() * 3))); lastPower = now;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.update();
        if (o.z > 1.2) { obstacles.splice(i, 1); continue; }
        if (o.z > 0.74 && o.z < 0.96 && o.lane === player.targetLane) {
          const canJump = o.type === 'barrier' && player.jumping && player.yOff < -22;
          const canSlide = o.type === 'train' && player.sliding;
          if (!canJump && !canSlide) {
            if (shieldTimer > 0) {
              shieldTimer = 0;
              obstacles.splice(i, 1);
              for (let k = 0; k < 12; k++) particles.push(new Particle(player.x, zToY(player.z), '#29B6F6'));
              sfxPower();
            } else {
              endGame(); return;
            }
          }
        }
      }

      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        c.update();
        if (c.z > 1.15) { coins.splice(i, 1); continue; }
        if (c.z > 0.72 && c.z < 0.96 && Math.abs(c.lane - player.targetLane) < 0.35) {
          score += 1 + Math.floor(combo / 5);
          combo++; comboTimer = 48;
          coinsEl.textContent = score;
          sfxCoin();
          for (let k = 0; k < 6; k++) particles.push(new Particle(laneX(c.lane, c.z), zToY(c.z), '#FFC107'));
          coins.splice(i, 1);
          if (combo >= 5 && combo % 5 === 0) {
            comboText.textContent = 'COMBO x' + (Math.floor(combo / 5) + 1);
            comboText.style.opacity = '1';
            setTimeout(() => comboText.style.opacity = '0', 550);
          }
        }
      }

      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.update();
        if (p.z > 1.15) { powerups.splice(i, 1); continue; }
        if (p.z > 0.72 && p.z < 0.96 && p.lane === player.targetLane) {
          sfxPower();
          if (p.type === 'magnet') magnetTimer = 380;
          if (p.type === 'shield') shieldTimer = 320;
          if (p.type === 'speed') speedTimer = 250;
          for (let k = 0; k < 10; k++) particles.push(new Particle(laneX(p.lane, p.z), zToY(p.z), '#E040FB'));
          powerups.splice(i, 1);
        }
      }

      particles.forEach(p => p.update());
      particles = particles.filter(p => p.life > 0);
      distanceEl.textContent = Math.floor(distance);
    }

    function draw() {
      ctx.save();
      if (shake > 0.4) ctx.translate(rand(-shake, shake), rand(-shake, shake));
      ctx.clearRect(0, 0, W, H);

      drawSky();
      buildings.forEach(b => b.draw());
      palms.forEach(p => p.draw());
      drawTracks();

      const all = [...obstacles, ...coins, ...powerups];
      all.sort((a, b) => a.z - b.z);
      all.forEach(o => o.draw());
      particles.forEach(p => p.draw());
      if (player) player.draw();

      ctx.restore();
    }

    function loop() {
      update(); draw();
      if (gameRunning) animId = requestAnimationFrame(loop);
    }

    function startGame() {
      ensureAudio();
      startScreen.style.display = 'none';
      gameOverScreen.style.display = 'none';

      player = new Player();
      obstacles = []; coins = []; powerups = []; particles = [];
      buildings = []; palms = [];
      for (let i = 0; i < 8; i++) {
        buildings.push(new Building(-1));
        buildings.push(new Building(1));
        buildings[buildings.length - 2].z = Math.random();
        buildings[buildings.length - 1].z = Math.random();
      }
      for (let i = 0; i < 5; i++) {
        palms.push(new Palm(-1));
        palms.push(new Palm(1));
        palms[palms.length - 2].z = Math.random();
        palms[palms.length - 1].z = Math.random();
      }

      score = 0; distance = 0; speed = 7.5; baseSpeed = 7.5;
      combo = 0; comboTimer = 0; shake = 0;
      magnetTimer = shieldTimer = speedTimer = 0;
      lastObs = lastCoin = lastPower = performance.now();
      bgOffset = 0;
      coinsEl.textContent = '0';
      distanceEl.textContent = '0';
      bestEl.textContent = best;

      gameRunning = true;
      loop();
    }

    function endGame() {
      gameRunning = false;
      cancelAnimationFrame(animId);
      sfxHit();
      shake = 14;
      if (Math.floor(distance) > best) {
        best = Math.floor(distance);
        localStorage.setItem('sr_best', best);
      }
      finalScoreEl.textContent = Math.floor(distance);
      finalBestEl.textContent = best;
      bestEl.textContent = best;
      gameOverScreen.style.display = 'flex';
    }

    document.addEventListener('keydown', e => {
      if (!gameRunning) return;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') player.moveLeft();
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') player.moveRight();
      if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') {
        e.preventDefault(); player.jump();
      }
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        e.preventDefault(); player.slide();
      }
    });

    let tx = 0, ty = 0;
    canvas.addEventListener('touchstart', e => {
      tx = e.touches[0].clientX; ty = e.touches[0].clientY;
    }, { passive: true });
    canvas.addEventListener('touchend', e => {
      if (!gameRunning) return;
      const dx = e.changedTouches[0].clientX - tx;
      const dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 28) player.moveRight();
        else if (dx < -28) player.moveLeft();
      } else {
        if (dy < -28) player.jump();
        else if (dy > 28) player.slide();
      }
    }, { passive: true });
    canvas.addEventListener('click', () => { if (gameRunning) player.jump(); });
  </script>
</body>
</html>
