<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Subway Surfers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
body{background:#0d0d1a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,sans-serif;overflow:hidden;color:#fff}
#gameContainer{position:relative;width:100%;max-width:420px;height:100vh;max-height:800px;background:#111;box-shadow:0 0 80px rgba(0,0,0,.95);overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:0;left:0;width:100%;padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
.hud{background:rgba(0,0,0,.55);backdrop-filter:blur(8px);padding:6px 13px;border-radius:18px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.12);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hud span{min-width:28px;text-align:right}
#powerupHud{position:absolute;top:50px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;pointer-events:none}
.power-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:rgba(0,0,0,.6);border:2.5px solid #FFD700;opacity:0;transition:opacity .2s}
.power-icon.active{opacity:1}
#startScreen,#gameOverScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(10,15,40,.95),rgba(25,10,50,.97));display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20;text-align:center;padding:24px}
h1{font-size:2.4rem;margin-bottom:8px;background:linear-gradient(135deg,#FFD700,#FF6B00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 20px rgba(255,180,0,.5))}
.subtitle{font-size:.95rem;opacity:.75;margin-bottom:28px;line-height:1.55}
button{background:linear-gradient(135deg,#FF6B00,#FF9500);border:none;color:#fff;font-size:1.25rem;font-weight:800;padding:15px 50px;border-radius:50px;cursor:pointer;box-shadow:0 8px 30px rgba(255,107,0,.5);letter-spacing:1px}
button:active{transform:scale(.96)}
.controls-info{margin-top:30px;font-size:.85rem;opacity:.55;line-height:1.75}
#finalScore{font-size:3rem;font-weight:800;background:linear-gradient(135deg,#FFD700,#FF9500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:10px 0 6px}
.high-score-label{font-size:.9rem;opacity:.7;margin-bottom:20px}
#comboText{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:2.2rem;font-weight:900;color:#FFD700;text-shadow:0 0 22px rgba(255,215,0,.9);opacity:0;pointer-events:none;z-index:15;transition:opacity .15s}
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div class="hud">🪙 <span id="coins">0</span></div>
  <div class="hud">🏆 <span id="best">0</span></div>
  <div class="hud">📏 <span id="distance">0</span>m</div>
</div>
<div id="powerupHud">
  <div class="power-icon" id="iconMagnet">🧲</div>
  <div class="power-icon" id="iconShield">🛡️</div>
  <div class="power-icon" id="iconSpeed">⚡</div>
</div>
<div id="comboText">COMBO x2</div>
<div id="startScreen">
  <h1>SUBWAY SURFERS</h1>
  <p class="subtitle">Desvie dos trens • Colete moedas<br>Power-ups e bata seu recorde!</p>
  <button onclick="startGame()">JOGAR</button>
  <div class="controls-info">
    ← → ou A/D — mudar de faixa<br>
    ↑ / Espaço / W — pular<br>
    ↓ / S — deslizar<br>
    (deslize o dedo no celular)
  </div>
</div>
<div id="gameOverScreen" style="display:none">
  <h1>GAME OVER</h1>
  <div id="finalScore">0</div>
  <p class="high-score-label">metros • Melhor: <span id="finalBest">0</span>m</p>
  <button onclick="startGame()">JOGAR DE NOVO</button>
</div>
</div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const coinsEl=document.getElementById('coins');
const distanceEl=document.getElementById('distance');
const bestEl=document.getElementById('best');
const startScreen=document.getElementById('startScreen');
const gameOverScreen=document.getElementById('gameOverScreen');
const finalScoreEl=document.getElementById('finalScore');
const finalBestEl=document.getElementById('finalBest');
const comboText=document.getElementById('comboText');
const iconMagnet=document.getElementById('iconMagnet');
const iconShield=document.getElementById('iconShield');
const iconSpeed=document.getElementById('iconSpeed');

let W,H,laneW;
function resize(){
  const c=document.getElementById('gameContainer');
  canvas.width=c.clientWidth;canvas.height=c.clientHeight;
  W=canvas.width;H=canvas.height;laneW=W/3;
}
resize();window.addEventListener('resize',resize);

let player,obstacles=[],coins=[],powerups=[],particles=[],buildings=[],palms=[];
let score=0,distance=0,best=+localStorage.getItem('ss_best')||0;
let speed=8,baseSpeed=8,gameRunning=false,animId;
let lastObs=0,lastCoin=0,lastPower=0,bgOffset=0;
let combo=0,comboTimer=0,shake=0;
let magnetTimer=0,shieldTimer=0,speedTimer=0;
bestEl.textContent=best;

const AC=window.AudioContext||window.webkitAudioContext;let actx;
function ensureAudio(){if(!actx)actx=new AC()}
function beep(f,d,t='square',v=.08){
  if(!actx)return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=t;o.frequency.value=f;
  g.gain.setValueAtTime(v,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);
}
function sfxCoin(){beep(920,.06,'sine',.09);setTimeout(()=>beep(1350,.06,'sine',.07),40)}
function sfxJump(){beep(340,.09,'triangle',.06)}
function sfxSlide(){beep(150,.09,'sawtooth',.04)}
function sfxPower(){beep(560,.12,'sine',.09);setTimeout(()=>beep(840,.16,'sine',.07),60)}
function sfxHit(){beep(65,.25,'sawtooth',.14)}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function lerp(a,b,t){return a+(b-a)*t}
function rand(a,b){return a+Math.random()*(b-a)}

function zToY(z){return H*.28+z*H*.72}
function zToScale(z){return .15+z*1.15}
function laneX(lane,z){return W/2+(lane-1)*laneW*.78*zToScale(z)}

/* ===== JAKE STYLE PLAYER ===== */
class Player{
  constructor(){
    this.lane=1;this.targetLane=1;this.x=W/2;this.z=.90;
    this.yOff=0;this.vy=0;this.jumping=false;this.sliding=false;this.slideTimer=0;
    this.w=40;this.h=72;this.frame=0;
  }
  update(){
    this.x=lerp(this.x,laneX(this.targetLane,this.z),.26);
    this.frame+=.28;
    if(this.jumping){
      this.yOff+=this.vy;this.vy+=1.2;
      if(this.yOff>=0){this.yOff=0;this.jumping=false;this.vy=0}
    }
    if(this.sliding){this.slideTimer--;if(this.slideTimer<=0)this.sliding=false}
  }
  jump(){if(!this.jumping&&!this.sliding){this.jumping=true;this.vy=-16;sfxJump()}}
  slide(){if(!this.jumping&&!this.sliding){this.sliding=true;this.slideTimer=24;sfxSlide()}}
  moveLeft(){if(this.targetLane>0)this.targetLane--}
  moveRight(){if(this.targetLane<2)this.targetLane++}

  draw(){
    const s=zToScale(this.z);
    const baseY=zToY(this.z);
    const y=baseY+this.yOff-(this.sliding?18:0);
    const w=this.w*s,h=(this.sliding?this.h*.48:this.h)*s;
    const x=this.x;
    const bt=y-h;

    // shadow
    ctx.fillStyle='rgba(0,0,0,.32)';
    ctx.beginPath();ctx.ellipse(x,baseY+5,w*.48,5.5*s,0,0,Math.PI*2);ctx.fill();

    // legs + yellow shoes
    if(!this.sliding){
      const lo=Math.sin(this.frame)*3.5*s;
      ctx.fillStyle='#1a1a1a';
      ctx.fillRect(x-10*s,y-16*s+lo,8*s,14*s);
      ctx.fillRect(x+2*s,y-16*s-lo,8*s,14*s);
      // yellow shoes
      ctx.fillStyle='#FFD600';
      rr(x-12*s,y-5*s+lo,12*s,7*s,3*s);ctx.fill();
      rr(x,y-5*s-lo,12*s,7*s,3*s);ctx.fill();
      // shoe sole
      ctx.fillStyle='#F9A825';
      ctx.fillRect(x-12*s,y+1*s+lo,12*s,2.5*s);
      ctx.fillRect(x,y+1*s-lo,12*s,2.5*s);
    }else{
      ctx.fillStyle='#FFD600';
      rr(x-15*s,y-7*s,30*s,8*s,3*s);ctx.fill();
    }

    // body (cream/white)
    const bodyC=shieldTimer>0?'#81D4FA':'#FFF3E0';
    ctx.fillStyle=bodyC;
    rr(x-w*.36,bt+20*s,w*.72,h*.52,9*s);ctx.fill();

    // orange backpack
    ctx.fillStyle='#FF6D00';
    rr(x+w*.18,bt+24*s,w*.32,h*.38,6*s);ctx.fill();
    ctx.fillStyle='#E65100';
    ctx.fillRect(x+w*.24,bt+30*s,w*.18,5*s);
    // strap
    ctx.strokeStyle='#E65100';ctx.lineWidth=2.5*s;
    ctx.beginPath();ctx.moveTo(x-w*.2,bt+22*s);ctx.lineTo(x+w*.2,bt+28*s);ctx.stroke();

    // head
    ctx.fillStyle='#FFCC80';
    ctx.beginPath();ctx.arc(x,bt+15*s,13.5*s,0,Math.PI*2);ctx.fill();

    // red beanie
    ctx.fillStyle='#E53935';
    ctx.beginPath();
    ctx.ellipse(x,bt+7*s,15*s,10*s,0,Math.PI,0);ctx.fill();
    // beanie band
    ctx.fillStyle='#C62828';
    ctx.fillRect(x-15*s,bt+6*s,30*s,5.5*s);
    // pompom
    ctx.fillStyle='#E53935';
    ctx.beginPath();ctx.arc(x,bt-1*s,5.5*s,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFCDD2';
    ctx.beginPath();ctx.arc(x-1.5*s,bt-2.5*s,2*s,0,Math.PI*2);ctx.fill();

    // eyes
    ctx.fillStyle='#222';
    ctx.beginPath();
    ctx.arc(x-5*s,bt+14*s,2.8*s,0,Math.PI*2);
    ctx.arc(x+5*s,bt+14*s,2.8*s,0,Math.PI*2);ctx.fill();
    // eye shine
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(x-4*s,bt+13*s,1*s,0,Math.PI*2);
    ctx.arc(x+6*s,bt+13*s,1*s,0,Math.PI*2);ctx.fill();
    // smile
    ctx.strokeStyle='#E65100';ctx.lineWidth=1.8*s;
    ctx.beginPath();ctx.arc(x,bt+17*s,5.5*s,.2,Math.PI-.2);ctx.stroke();

    // arms
    ctx.fillStyle=bodyC;
    const as=Math.sin(this.frame)*5*s;
    ctx.fillRect(x-w*.48,bt+28*s+as,7*s,18*s);
    ctx.fillRect(x+w*.30,bt+28*s-as,7*s,18*s);
    // hands
    ctx.fillStyle='#FFCC80';
    ctx.beginPath();ctx.arc(x-w*.44,bt+46*s+as,4*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+w*.37,bt+46*s-as,4*s,0,Math.PI*2);ctx.fill();

    // shield aura
    if(shieldTimer>0){
      ctx.strokeStyle='rgba(100,200,255,.65)';ctx.lineWidth=3.5;
      ctx.beginPath();ctx.arc(x,bt+h*.42,Math.max(w,h)*.68,0,Math.PI*2);ctx.stroke();
    }

    // hoverboard / energy when jumping high
    if(this.jumping&&this.yOff<-30){
      ctx.fillStyle='rgba(0,230,118,.7)';
      ctx.beginPath();
      ctx.moveTo(x-10*s,baseY+8);
      ctx.lineTo(x,baseY+25*s);
      ctx.lineTo(x+10*s,baseY+8);
      ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(0,255,150,.4)';
      ctx.beginPath();ctx.ellipse(x,baseY+12,14*s,6*s,0,0,Math.PI*2);ctx.fill();
    }
  }
}

/* ===== TRAINS & BARRIERS ===== */
class Obstacle{
  constructor(lane){
    this.lane=lane;this.z=0;
    this.type=Math.random()>.4?'train':'barrier';
    this.hBase=this.type==='train'?rand(100,150):rand(40,58);
    this.color=this.type==='train'
      ?['#1565C0','#C62828','#6A1B9A','#2E7D32','#E65100'][Math.floor(Math.random()*5)]
      :'#5D4037';
  }
  update(){this.z+=speed*.0044}
  get y(){return zToY(this.z)}
  get scale(){return zToScale(this.z)}
  get x(){return laneX(this.lane,this.z)}

  draw(){
    if(this.z>1.18)return;
    const s=this.scale;
    const w=(this.type==='train'?74:50)*s;
    const h=this.hBase*s;
    const x=this.x-w/2,y=this.y-h;

    if(this.type==='train'){
      // body
      ctx.fillStyle=this.color;
      rr(x,y,w,h,8*s);ctx.fill();
      // top dark
      ctx.fillStyle='rgba(0,0,0,.22)';
      ctx.fillRect(x,y,w,12*s);
      // windows
      ctx.fillStyle='#B3E5FC';
      const rows=Math.min(4,Math.floor(h/(26*s)));
      for(let i=0;i<rows;i++){
        rr(x+10*s,y+16*s+i*26*s,w-20*s,16*s,4*s);ctx.fill();
      }
      // yellow stripe
      ctx.fillStyle='#FFD600';
      ctx.fillRect(x,y+h-12*s,w,10*s);
      // wheels
      ctx.fillStyle='#212121';
      ctx.beginPath();
      ctx.arc(x+18*s,y+h+4,9*s,0,Math.PI*2);
      ctx.arc(x+w-18*s,y+h+4,9*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#9E9E9E';
      ctx.beginPath();
      ctx.arc(x+18*s,y+h+4,4*s,0,Math.PI*2);
      ctx.arc(x+w-18*s,y+h+4,4*s,0,Math.PI*2);ctx.fill();
    }else{
      // barrier
      ctx.fillStyle='#6D4C41';
      rr(x,y,w,h,4*s);ctx.fill();
      ctx.fillStyle='#FFD600';
      for(let i=0;i<3;i++)ctx.fillRect(x+5*s,y+6*s+i*14*s,w-10*s,6*s);
      ctx.fillStyle='#4E342E';
      ctx.fillRect(x-5*s,y+h*.25,7*s,h*.75);
      ctx.fillRect(x+w-2*s,y+h*.25,7*s,h*.75);
    }
  }
}

/* ===== COIN ===== */
class Coin{
  constructor(lane){this.lane=lane;this.z=0;this.r=13;this.rot=Math.random()*6}
  update(){
    this.z+=speed*.0044;this.rot+=.14;
    if(magnetTimer>0&&player&&Math.abs(player.z-this.z)<.4){
      this.lane=lerp(this.lane,player.targetLane,.2);
      this.z=lerp(this.z,player.z,.15);
    }
  }
  draw(){
    if(this.z>1.12)return;
    const s=zToScale(this.z);
    const x=laneX(this.lane,this.z),y=zToY(this.z)-30*s,r=this.r*s;
    ctx.save();ctx.translate(x,y);ctx.rotate(this.rot);
    ctx.fillStyle='#FFC107';
    ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFE082';
    ctx.beginPath();ctx.arc(-r*.3,-r*.3,r*.35,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#FF8F00';ctx.lineWidth=2.2*s;
    ctx.beginPath();ctx.arc(0,0,r*.72,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#FF8F00';
    ctx.font='bold '+Math.max(10,14*s)+'px Arial';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,1);
    ctx.restore();
  }
}

/* ===== POWERUP ===== */
class PowerUp{
  constructor(lane){
    this.lane=lane;this.z=0;
    this.type=['magnet','shield','speed'][Math.floor(Math.random()*3)];
    this.bob=Math.random()*6;
  }
  update(){this.z+=speed*.0044;this.bob+=.15}
  draw(){
    if(this.z>1.12)return;
    const s=zToScale(this.z);
    const x=laneX(this.lane,this.z),y=zToY(this.z)-40*s+Math.sin(this.bob)*8,r=16*s;
    const cols={magnet:'#E040FB',shield:'#29B6F6',speed:'#FFEE58'};
    const icons={magnet:'🧲',shield:'🛡️',speed:'⚡'};
    ctx.fillStyle=cols[this.type];
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.beginPath();ctx.arc(x-r*.3,y-r*.3,r*.35,0,Math.PI*2);ctx.fill();
    ctx.font=Math.max(12,17*s)+'px Arial';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(icons[this.type],x,y+1);
  }
}

class Particle{
  constructor(x,y,color){
    this.x=x;this.y=y;this.vx=rand(-5.5,5.5);this.vy=rand(-10,-2);
    this.life=1;this.color=color;this.size=rand(3,7.5);
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.3;this.life-=.038}
  draw(){
    ctx.globalAlpha=Math.max(0,this.life);
    ctx.fillStyle=this.color;
    ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
}

/* ===== BUILDINGS ===== */
class Building{
  constructor(side){
    this.side=side;this.z=Math.random();
    this.h=rand(100,260);this.w=rand(48,90);
    this.hue=rand(0,360);this.sat=rand(45,75);this.light=rand(38,58);
    this.windows=Math.floor(rand(4,9));
  }
  update(){
    this.z+=speed*.0037;
    if(this.z>1.3){this.z=-.2;this.h=rand(100,270);this.w=rand(48,95);this.hue=rand(0,360)}
  }
  draw(){
    if(this.z<-.08||this.z>1.18)return;
    const s=zToScale(this.z)*.95;
    const y=zToY(this.z);
    const xBase=this.side<0?W*.05:W*.95;
    const x=xBase+this.side*(20*s);
    const bw=this.w*s,bh=this.h*s;
    ctx.fillStyle=`hsl(${this.hue},${this.sat}%,${this.light}%)`;
    ctx.fillRect(x-bw/2,y-bh,bw,bh);
    ctx.fillStyle=`hsl(${this.hue},${this.sat}%,${this.light-14}%)`;
    ctx.fillRect(x-bw/2-4*s,y-bh-7*s,bw+8*s,9*s);
    ctx.fillStyle='rgba(255,235,120,.5)';
    for(let r=0;r<this.windows;r++){
      for(let c=0;c<2;c++){
        ctx.fillRect(x-bw/2+9*s+c*(bw*.42),y-bh+14*s+r*(bh/this.windows),8*s,10*s);
      }
    }
  }
}

/* ===== PALM TREES ===== */
class Palm{
  constructor(side){
    this.side=side;this.z=Math.random();this.h=rand(70,140);
  }
  update(){
    this.z+=speed*.0037;
    if(this.z>1.3){this.z=-.12;this.h=rand(70,150)}
  }
  draw(){
    if(this.z<0||this.z>1.12)return;
    const s=zToScale(this.z)*.92;
    const y=zToY(this.z);
    const x=this.side<0?W*.11+this.side*12*s:W*.89+this.side*12*s;
    const th=this.h*s;
    // trunk
    ctx.strokeStyle='#6D4C41';ctx.lineWidth=6*s;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.quadraticCurveTo(x+this.side*10*s,y-th*.5,x,y-th);
    ctx.stroke();
    // leaves
    ctx.fillStyle='#43A047';
    for(let i=0;i<6;i++){
      const ang=-1.4+i*.55;
      ctx.beginPath();
      ctx.ellipse(x+Math.cos(ang)*22*s,y-th+Math.sin(ang)*7*s,22*s,7*s,ang,0,Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle='#2E7D32';
    ctx.beginPath();ctx.arc(x,y-th,7*s,0,Math.PI*2);ctx.fill();
  }
}

/* ===== BACKGROUND ===== */
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H*.35);
  g.addColorStop(0,'#29B6F6');
  g.addColorStop(.5,'#81D4FA');
  g.addColorStop(1,'#E1F5FE');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H*.35);
  // sun
  ctx.fillStyle='#FFF59D';
  ctx.beginPath();ctx.arc(W*.8,H*.09,28,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,245,157,.22)';
  ctx.beginPath();ctx.arc(W*.8,H*.09,48,0,Math.PI*2);ctx.fill();
}

function drawTracks(){
  const hz=H*.28;

  // grass
  ctx.fillStyle='#66BB6A';
  ctx.beginPath();ctx.moveTo(0,hz);ctx.lineTo(W*.18,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(W,hz);ctx.lineTo(W*.82,H);ctx.lineTo(W,H);ctx.closePath();ctx.fill();

  // brown wooden track bed
  const bg=ctx.createLinearGradient(0,hz,0,H);
  bg.addColorStop(0,'#A1887F');
  bg.addColorStop(.4,'#8D6E63');
  bg.addColorStop(1,'#5D4037');
  ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.moveTo(W*.30,hz);ctx.lineTo(W*.70,hz);
  ctx.lineTo(W*.99,H);ctx.lineTo(W*.01,H);
  ctx.closePath();ctx.fill();

  // lane dashed lines
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2.5;
  ctx.setLineDash([15,20]);
  ctx.beginPath();ctx.moveTo(W*.40,hz);ctx.lineTo(W*.28,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W*.60,hz);ctx.lineTo(W*.72,H);ctx.stroke();
  ctx.setLineDash([]);

  // shiny metal rails
  ctx.strokeStyle='#CFD8DC';ctx.lineWidth=4;ctx.lineCap='round';
  for(let lane=0;lane<3;lane++){
    const t0=(lane+.12)/3,t1=(lane+.88)/3;
    const l0=lerp(W*.30,W*.70,t0),r0=lerp(W*.30,W*.70,t1);
    const l1=lerp(W*.01,W*.99,t0),r1=lerp(W*.01,W*.99,t1);
    ctx.beginPath();ctx.moveTo(l0,hz);ctx.lineTo(l1,H);ctx.stroke();
    ctx.beginPath();ctx.moveTo(r0,hz);ctx.lineTo(r1,H);ctx.stroke();
  }

  // wooden sleepers
  ctx.fillStyle='#4E342E';
  const sp=.04,off=(bgOffset*.0044)%sp;
  for(let z=off;z<1.08;z+=sp){
    const y=zToY(z),s=zToScale(z);
    const left=lerp(W*.30,W*.01,z),right=lerp(W*.70,W*.99,z);
    const sw=7*s;
    ctx.fillRect(left+5,y-sw*.35,right-left-10,sw);
  }
}

/* ===== LOGIC ===== */
function spawnObstacle(){
  const used=obstacles.filter(o=>o.z<.2).map(o=>o.lane);
  let lane;do{lane=Math.floor(Math.random()*3)}while(used.includes(lane)&&used.length<2);
  obstacles.push(new Obstacle(lane));
}

function update(){
  if(!gameRunning)return;
  distance+=speed*.13;bgOffset+=speed;
  baseSpeed=8+Math.min(10,Math.floor(distance/160));
  speed=speedTimer>0?baseSpeed*1.38:baseSpeed;

  if(magnetTimer>0)magnetTimer--;
  if(shieldTimer>0)shieldTimer--;
  if(speedTimer>0)speedTimer--;
  if(comboTimer>0)comboTimer--;else combo=0;
  if(shake>0)shake*=.83;

  iconMagnet.classList.toggle('active',magnetTimer>0);
  iconShield.classList.toggle('active',shieldTimer>0);
  iconSpeed.classList.toggle('active',speedTimer>0);

  player.update();
  buildings.forEach(b=>b.update());
  palms.forEach(p=>p.update());

  const now=performance.now();
  if(now-lastObs>Math.max(380,850-distance*.45)){spawnObstacle();lastObs=now}
  if(now-lastCoin>420){coins.push(new Coin(Math.floor(Math.random()*3)));lastCoin=now}
  if(now-lastPower>5800&&distance>60){powerups.push(new PowerUp(Math.floor(Math.random()*3)));lastPower=now}

  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];o.update();
    if(o.z>1.22){obstacles.splice(i,1);continue}
    if(o.z>.75&&o.z<.97&&o.lane===player.targetLane){
      const canJump=o.type==='barrier'&&player.jumping&&player.yOff<-20;
      const canSlide=o.type==='train'&&player.sliding;
      if(!canJump&&!canSlide){
        if(shieldTimer>0){
          shieldTimer=0;obstacles.splice(i,1);
          for(let k=0;k<14;k++)particles.push(new Particle(player.x,zToY(player.z),'#29B6F6'));
          sfxPower();
        }else{endGame();return}
      }
    }
  }

  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];c.update();
    if(c.z>1.18){coins.splice(i,1);continue}
    if(c.z>.74&&c.z<.97&&Math.abs(c.lane-player.targetLane)<.32){
      score+=1+Math.floor(combo/5);combo++;comboTimer=50;
      coinsEl.textContent=score;sfxCoin();
      for(let k=0;k<7;k++)particles.push(new Particle(laneX(c.lane,c.z),zToY(c.z),'#FFC107'));
      coins.splice(i,1);
      if(combo>=5&&combo%5===0){
        comboText.textContent='COMBO x'+(Math.floor(combo/5)+1);
        comboText.style.opacity='1';
        setTimeout(()=>comboText.style.opacity='0',550);
      }
    }
  }

  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];p.update();
    if(p.z>1.18){powerups.splice(i,1);continue}
    if(p.z>.74&&p.z<.97&&p.lane===player.targetLane){
      sfxPower();
      if(p.type==='magnet')magnetTimer=400;
      if(p.type==='shield')shieldTimer=340;
      if(p.type==='speed')speedTimer=260;
      for(let k=0;k<12;k++)particles.push(new Particle(laneX(p.lane,p.z),zToY(p.z),'#E040FB'));
      powerups.splice(i,1);
    }
  }

  particles.forEach(p=>p.update());
  particles=particles.filter(p=>p.life>0);
  distanceEl.textContent=Math.floor(distance);
}

function draw(){
  ctx.save();
  if(shake>.4)ctx.translate(rand(-shake,shake),rand(-shake,shake));
  ctx.clearRect(0,0,W,H);
  drawSky();
  buildings.forEach(b=>b.draw());
  palms.forEach(p=>p.draw());
  drawTracks();
  const all=[...obstacles,...coins,...powerups];
  all.sort((a,b)=>a.z-b.z);
  all.forEach(o=>o.draw());
  particles.forEach(p=>p.draw());
  if(player)player.draw();
  ctx.restore();
}

function loop(){update();draw();if(gameRunning)animId=requestAnimationFrame(loop)}

function startGame(){
  ensureAudio();
  startScreen.style.display='none';gameOverScreen.style.display='none';
  player=new Player();
  obstacles=[];coins=[];powerups=[];particles=[];
  buildings=[];palms=[];
  for(let i=0;i<9;i++){
    buildings.push(new Building(-1));buildings.push(new Building(1));
    buildings[buildings.length-2].z=Math.random();
    buildings[buildings.length-1].z=Math.random();
  }
  for(let i=0;i<6;i++){
    palms.push(new Palm(-1));palms.push(new Palm(1));
    palms[palms.length-2].z=Math.random();
    palms[palms.length-1].z=Math.random();
  }
  score=0;distance=0;speed=8;baseSpeed=8;
  combo=0;comboTimer=0;shake=0;
  magnetTimer=shieldTimer=speedTimer=0;
  lastObs=lastCoin=lastPower=performance.now();bgOffset=0;
  coinsEl.textContent='0';distanceEl.textContent='0';bestEl.textContent=best;
  gameRunning=true;loop();
}

function endGame(){
  gameRunning=false;cancelAnimationFrame(animId);sfxHit();shake=16;
  if(Math.floor(distance)>best){best=Math.floor(distance);localStorage.setItem('ss_best',best)}
  finalScoreEl.textContent=Math.floor(distance);
  finalBestEl.textContent=best;bestEl.textContent=best;
  gameOverScreen.style.display='flex';
}

document.addEventListener('keydown',e=>{
  if(!gameRunning)return;
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')player.moveLeft();
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')player.moveRight();
  if(e.key==='ArrowUp'||e.key===' '||e.key==='w'||e.key==='W'){e.preventDefault();player.jump()}
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){e.preventDefault();player.slide()}
});

let tx=0,ty=0;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!gameRunning)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){if(dx>28)player.moveRight();else if(dx<-28)player.moveLeft()}
  else{if(dy<-28)player.jump();else if(dy>28)player.slide()}
},{passive:true});
canvas.addEventListener('click',()=>{if(gameRunning)player.jump()});
</script>
