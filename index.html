<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Subway Surfers Clone Complete</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
  body{background:#0a0a16;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI',Roboto,sans-serif;overflow:hidden;color:#fff}
  #gameContainer{position:relative;width:100%;max-width:440px;height:100vh;max-height:840px;background:#111;box-shadow:0 0 100px rgba(0,0,0,.95);overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #ui{position:absolute;top:0;left:0;width:100%;padding:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
  .hud{background:rgba(0,0,0,.65);backdrop-filter:blur(8px);padding:6px 14px;border-radius:20px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.18);box-shadow:0 4px 10px rgba(0,0,0,.4)}
  #powerupHud{position:absolute;top:60px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10;pointer-events:none}
  .power-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(0,0,0,.7);border:3px solid #FFD700;opacity:0;transition:opacity .2s, transform .2s;transform:scale(.8)}
  .power-icon.active{opacity:1;transform:scale(1)}
  #startScreen,#gameOverScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(15,23,42,.96),rgba(30,15,60,.98));display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20;text-align:center;padding:24px}
  h1{font-size:2.8rem;margin-bottom:6px;background:linear-gradient(135deg,#FFD700,#FF3D00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 25px rgba(255,180,0,.6));font-weight:900;letter-spacing:-1px}
  .subtitle{font-size:1rem;opacity:.8;margin-bottom:30px;line-height:1.5}
  button{background:linear-gradient(135deg,#FF6D00,#FF9100);border:none;color:#fff;font-size:1.4rem;font-weight:900;padding:16px 55px;border-radius:50px;cursor:pointer;box-shadow:0 10px 32px rgba(255,109,0,.6);letter-spacing:1px;transition:transform .1s}
  button:active{transform:scale(.95)}
  .controls-info{margin-top:35px;font-size:.85rem;opacity:.6;line-height:1.8;background:rgba(255,255,255,.05);padding:12px 20px;border-radius:12px}
  #finalScore{font-size:3.5rem;font-weight:900;background:linear-gradient(135deg,#FFD700,#FF9100);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:10px 0 2px}
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div class="hud">🪙 <span id="coins">0</span></div>
    <div class="hud">🏆 <span id="best">0</span></div>
    <div class="hud">📏 <span id="distance">0</span>m</div>
  </div>
  <div id="powerupHud">
    <div class="power-icon" id="iconMagnet">🧲</div>
    <div class="power-icon" id="iconShield">🛡️</div>
    <div class="power-icon" id="iconSpeed">⚡</div>
    <div class="power-icon" id="iconJetpack">🚀</div>
  </div>
  <div id="startScreen">
    <h1>SUBWAY SURFERS</h1>
    <p class="subtitle">Fuja do Guarda e do Cachorro!<br>Desvie dos trens e pegue Jetpacks!</p>
    <button onclick="startGame()">JOGAR</button>
    <div class="controls-info">
      ← → / A D — Trocar Faixa<br>
      ↑ / Espaço / W — Pular<br>
      ↓ / S — Deslizar
    </div>
  </div>
  <div id="gameOverScreen" style="display:none">
    <h1>BUMPED!</h1>
    <div id="finalScore">0</div>
    <p style="opacity:.7;margin-bottom:20px">metros • Melhor: <span id="finalBest">0</span>m</p>
    <button onclick="startGame()">TENTAR NOVAMENTE</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const coinsEl = document.getElementById('coins');
const distanceEl = document.getElementById('distance');
const bestEl = document.getElementById('best');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScoreEl = document.getElementById('finalScore');
const finalBestEl = document.getElementById('finalBest');

let W, H, laneW;
function resize(){
  const c = document.getElementById('gameContainer');
  canvas.width = c.clientWidth;
  canvas.height = c.clientHeight;
  W = canvas.width;
  H = canvas.height;
  laneW = W / 3;
}
resize();
window.addEventListener('resize', resize);

// Configurações de Perspectiva 3D
const VP_Y = H * 0.28; // Ponto de fuga no horizonte
function zToY(z) { return VP_Y + Math.pow(z, 1.8) * (H - VP_Y); }
function zToScale(z) { return 0.08 + Math.pow(z, 1.5) * 1.05; }
function laneX(lane, z) {
  const scale = zToScale(z);
  const center = W / 2;
  const offset = (lane - 1) * (laneW * 0.85);
  return center + offset * scale;
}

let player, inspector, obstacles = [], coins = [], powerups = [], particles = [], scenery = [];
let score = 0, distance = 0, best = +localStorage.getItem('ss_best') || 0;
let speed = 7.5, baseSpeed = 7.5, gameRunning = false, animId;
let lastObs = 0, lastCoin = 0, lastPower = 0, bgOffset = 0, time = 0;
let magnetTimer = 0, shieldTimer = 0, speedTimer = 0, jetpackTimer = 0;
let inspectorDist = 1.0; // Distância do guarda (0 = pega o jogador)

bestEl.textContent = best;

// Áudio Sintetizado
const AC = window.AudioContext || window.webkitAudioContext;
let actx;
function ensureAudio(){ if(!actx) actx = new AC(); }
function beep(f, d, t='square', v=.08){
  if(!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = t; o.frequency.value = f;
  g.gain.setValueAtTime(v, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + d);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + d);
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

class Player {
  constructor(){
    this.lane = 1; this.targetLane = 1;
    this.x = W/2; this.z = 0.88;
    this.yOff = 0; this.vy = 0;
    this.jumping = false; this.sliding = false; this.slideTimer = 0;
    this.w = 42; this.h = 75; this.frame = 0;
  }
  update(){
    const targetX = laneX(this.targetLane, this.z);
    this.x += (targetX - this.x) * 0.25; // Movimento ágil de troca de faixa
    this.frame += 0.35;

    if(jetpackTimer > 0) {
      this.yOff = -140; // Voando com Jetpack
      return;
    }

    if(this.jumping){
      this.yOff += this.vy;
      this.vy += 1.1;
      if(this.yOff >= 0){ this.yOff = 0; this.jumping = false; }
    }
    if(this.sliding){
      this.slideTimer--;
      if(this.slideTimer <= 0) this.sliding = false;
    }
  }
  jump(){
    if(!this.jumping && !this.sliding && jetpackTimer <= 0){
      this.jumping = true; this.vy = -16;
      beep(350, .08, 'triangle');
    }
  }
  slide(){
    if(!this.jumping && !this.sliding && jetpackTimer <= 0){
      this.sliding = true; this.slideTimer = 25;
      beep(180, .08, 'sawtooth');
    }
  }
  moveLeft(){ if(this.targetLane > 0) this.targetLane--; }
  moveRight(){ if(this.targetLane < 2) this.targetLane++; }

  draw(){
    const s = zToScale(this.z);
    const baseY = zToY(this.z);
    const y = baseY + this.yOff - (this.sliding ? 18 : 0);
    const w = this.w * s, h = (this.sliding ? this.h * 0.5 : this.h) * s;
    const x = this.x;
    const bt = y - h;

    // Sombra
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(x, baseY + 4, w * 0.5, 6 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // Jetpack Fogo
    if(jetpackTimer > 0){
      ctx.fillStyle = '#FF3D00';
      ctx.fillRect(x - 12*s, y + 5*s, 8*s, 25*s);
      ctx.fillRect(x + 4*s, y + 5*s, 8*s, 25*s);
      ctx.fillStyle = '#FFEA00';
      ctx.fillRect(x - 10*s, y + 5*s, 4*s, 18*s);
      ctx.fillRect(x + 6*s, y + 5*s, 4*s, 18*s);
    }

    // Corpo (Jake - Boné Vermelho, Jaqueta Jeans, Calça Branca)
    // Pernas
    ctx.fillStyle = '#FFFFFF';
    const legAnim = Math.sin(this.frame) * 6 * s;
    ctx.fillRect(x - 10*s, y - 20*s + legAnim, 8*s, 18*s);
    ctx.fillRect(x + 2*s, y - 20*s - legAnim, 8*s, 18*s);

    // Tênis Vermelho
    ctx.fillStyle = '#D50000';
    rr(x - 12*s, y - 4*s + legAnim, 10*s, 6*s, 2*s); ctx.fill();
    rr(x + 2*s, y - 4*s - legAnim, 10*s, 6*s, 2*s); ctx.fill();

    // Jaqueta
    ctx.fillStyle = '#1565C0'; // Jeans
    rr(x - w*0.38, bt + 22*s, w*0.76, h*0.48, 6*s); ctx.fill();
    // Capuz/Moletom Branco por baixo
    ctx.fillStyle = '#ECEFF1';
    ctx.fillRect(x - 6*s, bt + 22*s, 12*s, h*0.42);

    // Cabeça
    ctx.fillStyle = '#FFCC80';
    ctx.beginPath(); ctx.arc(x, bt + 16*s, 12*s, 0, Math.PI * 2); ctx.fill();

    // Boné Virado para Trás (Símbolo de Subway Surfers)
    ctx.fillStyle = '#D50000';
    ctx.beginPath();
    ctx.arc(x, bt + 12*s, 13*s, Math.PI, 0); ctx.fill();
    ctx.fillRect(x - 14*s, bt + 10*s, 28*s, 5*s);
    // Aba virada para trás
    ctx.fillStyle = '#B71C1C';
    rr(x - 10*s, bt + 15*s, 20*s, 4*s, 2*s); ctx.fill();

    // Escudo Visual
    if(shieldTimer > 0){
      ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(x, bt + h*0.5, w*0.8, 0, Math.PI*2); ctx.stroke();
    }
  }
}

// Guarda e Pitbull perseguindo
class Inspector {
  draw(zDist){
    if(zDist >= 1.8) return; // Muito longe, não desenha
    const z = player.z + zDist * 0.12;
    const s = zToScale(z);
    const baseY = zToY(z);
    const x = laneX(player.targetLane, z) - 15 * s;
    const y = baseY;

    // Desenhar Guarda
    ctx.fillStyle = '#1A237E'; // Uniforme azul escuro
    rr(x - 15*s, y - 60*s, 30*s, 40*s, 4*s); ctx.fill();
    ctx.fillStyle = '#FFCC80'; // Rosto
    ctx.beginPath(); ctx.arc(x, y - 68*s, 10*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0D47A1'; // Quepe
    ctx.fillRect(x - 12*s, y - 78*s, 24*s, 8*s);

    // Pitbull ao lado
    const dogX = x + 35 * s;
    ctx.fillStyle = '#8D6E63'; // Pelagem marrom
    rr(dogX - 10*s, y - 25*s, 20*s, 18*s, 4*s); ctx.fill();
    ctx.beginPath(); ctx.arc(dogX + 8*s, y - 22*s, 7*s, 0, Math.PI*2); ctx.fill();
  }
}

class Obstacle {
  constructor(lane){
    this.lane = lane; this.z = 0;
    const rand = Math.random();
    if(rand > 0.55) this.type = 'train';
    else if(rand > 0.25) this.type = 'barrier_high';
    else this.type = 'barrier_low';

    this.color = ['#D50000', '#1565C0', '#2E7D32', '#FF6D00'][Math.floor(Math.random()*4)];
  }
  update(){ this.z += speed * 0.0038; }

  draw(){
    if(this.z > 1.15) return;
    const s = zToScale(this.z);
    const y = zToY(this.z);
    const x = laneX(this.lane, this.z);

    if(this.type === 'train'){
      const w = 78 * s, h = 110 * s;
      const tx = x - w/2, ty = y - h;
      // Corpo do Trem
      ctx.fillStyle = this.color;
      rr(tx, ty, w, h, 6*s); ctx.fill();
      // Frente Metálica
      ctx.fillStyle = '#CFD8DC';
      rr(tx + 6*s, ty + 12*s, w - 12*s, h*0.35, 4*s); ctx.fill();
      // Faróis
      ctx.fillStyle = '#FFEA00';
      ctx.beginPath();
      ctx.arc(tx + 12*s, ty + h - 18*s, 6*s, 0, Math.PI*2);
      ctx.arc(tx + w - 12*s, ty + h - 18*s, 6*s, 0, Math.PI*2); ctx.fill();
      // Para-choque
      ctx.fillStyle = '#37474F';
      ctx.fillRect(tx, ty + h - 10*s, w, 10*s);
    } else if(this.type === 'barrier_high') {
      // Barreira de Pular (Alta)
      const w = 58 * s, h = 52 * s;
      const bx = x - w/2, by = y - h;
      ctx.fillStyle = '#FF6D00';
      rr(bx, by, w, 14*s, 2*s); ctx.fill();
      ctx.fillStyle = '#212121';
      ctx.fillRect(bx + 6*s, by + 14*s, 8*s, h - 14*s);
      ctx.fillRect(bx + w - 14*s, by + 14*s, 8*s, h - 14*s);
    } else {
      // Barreira de Deslizar (Sinalizador Rígido Alto com passagem embaixo)
      const w = 62 * s, h = 70 * s;
      const bx = x - w/2, by = y - h;
      ctx.fillStyle = '#D50000';
      ctx.fillRect(bx, by, w, 16*s);
      ctx.fillStyle = '#FFF';
      ctx.fillRect(bx + 10*s, by, 12*s, 16*s);
      ctx.fillRect(bx + 38*s, by, 12*s, 16*s);
      // Suportes laterais altos
      ctx.fillStyle = '#424242';
      ctx.fillRect(bx, by, 6*s, h);
      ctx.fillRect(bx + w - 6*s, by, 6*s, h);
    }
  }
}

class Coin {
  constructor(lane, zOffset = 0){
    this.lane = lane; this.z = zOffset; this.rot = Math.random() * 6;
  }
  update(){
    this.z += speed * 0.0038;
    this.rot += 0.12;
    if(magnetTimer > 0 && Math.abs(player.z - this.z) < 0.45){
      this.lane += (player.targetLane - this.lane) * 0.2;
      this.z += (player.z - this.z) * 0.2;
    }
  }
  draw(){
    if(this.z > 1.1) return;
    const s = zToScale(this.z);
    const x = laneX(this.lane, this.z);
    const y = zToY(this.z) - 32 * s;
    const r = 12 * s;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(Math.cos(this.rot), 1); // Efeito de rotação 3D
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#FF8F00'; ctx.lineWidth = 2 * s; ctx.stroke();
    ctx.restore();
  }
}

class PowerUp {
  constructor(lane){
    this.lane = lane; this.z = 0;
    const types = ['magnet', 'shield', 'speed', 'jetpack'];
    this.type = types[Math.floor(Math.random() * types.length)];
  }
  update(){ this.z += speed * 0.0038; }
  draw(){
    if(this.z > 1.1) return;
    const s = zToScale(this.z);
    const x = laneX(this.lane, this.z);
    const y = zToY(this.z) - 38 * s;
    const r = 18 * s;

    const icons = {magnet:'🧲', shield:'🛡️', speed:'⚡', jetpack:'🚀'};
    ctx.fillStyle = '#00E676';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    ctx.font = `${Math.max(12, 18*s)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(icons[this.type], x, y);
  }
}

function drawBackground(){
  // Céu
  const grad = ctx.createLinearGradient(0, 0, 0, VP_Y);
  grad.addColorStop(0, '#0277BD');
  grad.addColorStop(1, '#81D4FA');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, VP_Y);

  // Sol de Tarde
  ctx.fillStyle = '#FFF59D';
  ctx.beginPath(); ctx.arc(W * 0.75, VP_Y * 0.4, 25, 0, Math.PI*2); ctx.fill();

  // Chão / Lastro dos Trilhos
  ctx.fillStyle = '#4E342E';
  ctx.fillRect(0, VP_Y, W, H - VP_Y);

  // Muros / Prédios Laterais
  ctx.fillStyle = '#37474F';
  ctx.beginPath();
  ctx.moveTo(0, VP_Y); ctx.lineTo(W * 0.15, VP_Y);
  ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W, VP_Y); ctx.lineTo(W * 0.85, VP_Y);
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();

  // Trilhos
  for(let lane = 0; lane < 3; lane++){
    const xStart = laneX(lane, 0);
    const xEnd = laneX(lane, 1.0);
    ctx.strokeStyle = '#B0BEC5'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(xStart - 12 * zToScale(0), VP_Y);
    ctx.lineTo(xEnd - 18 * zToScale(1), H);
    ctx.moveTo(xStart + 12 * zToScale(0), VP_Y);
    ctx.lineTo(xEnd + 18 * zToScale(1), H);
    ctx.stroke();
  }

  // Dormentes de Madeira dos Trilhos
  const step = 0.04;
  const offset = (bgOffset * 0.0038) % step;
  ctx.fillStyle = '#212121';
  for(let z = offset; z < 1.0; z += step){
    const y = zToY(z);
    const s = zToScale(z);
    const w = W * 0.75 * s;
    ctx.fillRect(W/2 - w/2, y, w, 4 * s);
  }
}

function update(){
  if(!gameRunning) return;
  time++;
  distance += speed * 0.12;
  bgOffset += speed;

  baseSpeed = 7.5 + Math.min(8, distance / 200);
  speed = (speedTimer > 0 || jetpackTimer > 0) ? baseSpeed * 1.4 : baseSpeed;

  // Gerenciar Power-ups
  if(magnetTimer > 0) magnetTimer--;
  if(shieldTimer > 0) shieldTimer--;
  if(speedTimer > 0) speedTimer--;
  if(jetpackTimer > 0) jetpackTimer--;

  document.getElementById('iconMagnet').classList.toggle('active', magnetTimer > 0);
  document.getElementById('iconShield').classList.toggle('active', shieldTimer > 0);
  document.getElementById('iconSpeed').classList.toggle('active', speedTimer > 0);
  document.getElementById('iconJetpack').classList.toggle('active', jetpackTimer > 0);

  // Aproximação do Guarda se o jogador errar algo (simulado)
  if(inspectorDist > 1.0) inspectorDist -= 0.002;

  player.update();

  // Spawns
  const now = performance.now();
  if(now - lastObs > Math.max(450, 950 - distance * 0.35)){
    obstacles.push(new Obstacle(Math.floor(Math.random() * 3)));
    lastObs = now;
  }
  if(now - lastCoin > 350){
    const lane = Math.floor(Math.random() * 3);
    for(let i = 0; i < 4; i++) coins.push(new Coin(lane, -i * 0.04));
    lastCoin = now;
  }
  if(now - lastPower > 7000){
    powerups.push(new PowerUp(Math.floor(Math.random() * 3)));
    lastPower = now;
  }

  // Atualizar e Colidir Obstáculos
  for(let i = obstacles.length - 1; i >= 0; i--){
    const o = obstacles[i]; o.update();
    if(o.z > 1.15){ obstacles.splice(i, 1); continue; }

    // Colisão (se não estiver voando de Jetpack)
    if(jetpackTimer <= 0 && o.z > 0.80 && o.z < 0.95 && o.lane === player.targetLane){
      let hit = false;
      if(o.type === 'train') hit = true;
      else if(o.type === 'barrier_high' && !player.jumping) hit = true;
      else if(o.type === 'barrier_low' && !player.sliding) hit = true;

      if(hit){
        if(shieldTimer > 0){
          shieldTimer = 0; obstacles.splice(i, 1);
          beep(600, .15);
        } else {
          endGame(); return;
        }
      }
    }
  }

  // Coleta de Moedas
  for(let i = coins.length - 1; i >= 0; i--){
    const c = coins[i]; c.update();
    if(c.z > 1.1){ coins.splice(i, 1); continue; }
    if(c.z > 0.78 && c.z < 0.96 && Math.abs(c.lane - player.targetLane) < 0.4){
      score++;
      coinsEl.textContent = score;
      beep(950, .05, 'sine');
      coins.splice(i, 1);
    }
  }

  // Coleta de Power-ups
  for(let i = powerups.length - 1; i >= 0; i--){
    const p = powerups[i]; p.update();
    if(p.z > 1.1){ powerups.splice(i, 1); continue; }
    if(p.z > 0.78 && p.z < 0.96 && p.lane === player.targetLane){
      beep(700, .12);
      if(p.type === 'magnet') magnetTimer = 350;
      if(p.type === 'shield') shieldTimer = 300;
      if(p.type === 'speed') speedTimer = 250;
      if(p.type === 'jetpack') jetpackTimer = 220;
      powerups.splice(i, 1);
    }
  }

  distanceEl.textContent = Math.floor(distance);
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  drawBackground();

  // Ordenação Z-buffer para desenhar do fundo para frente
  const renderList = [...obstacles, ...coins, ...powerups];
  renderList.sort((a, b) => a.z - b.z);

  renderList.forEach(obj => obj.draw());

  player.draw();
  inspector.draw(inspectorDist);
}

function loop(){
  update();
  draw();
  if(gameRunning) animId = requestAnimationFrame(loop);
}

function startGame(){
  ensureAudio();
  startScreen.style.display = 'none';
  gameOverScreen.style.display = 'none';

  player = new Player();
  inspector = new Inspector();
  obstacles = []; coins = []; powerups = [];
  score = 0; distance = 0; speed = 7.5;
  magnetTimer = shieldTimer = speedTimer = jetpackTimer = 0;
  inspectorDist = 1.0;
  lastObs = lastCoin = lastPower = performance.now();

  coinsEl.textContent = '0';
  distanceEl.textContent = '0';
  gameRunning = true;
  loop();
}

function endGame(){
  gameRunning = false;
  cancelAnimationFrame(animId);
  beep(90, .3, 'sawtooth');

  if(Math.floor(distance) > best){
    best = Math.floor(distance);
    localStorage.setItem('ss_best', best);
  }
  finalScoreEl.textContent = Math.floor(distance);
  finalBestEl.textContent = best;
  bestEl.textContent = best;
  gameOverScreen.style.display = 'flex';
}

// Eventos de Teclado
document.addEventListener('keydown', e => {
  if(!gameRunning) return;
  if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') player.moveLeft();
  if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') player.moveRight();
  if(e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W'){ e.preventDefault(); player.jump(); }
  if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S'){ e.preventDefault(); player.slide(); }
});

// Eventos Touch (Mobile)
let tx = 0, ty = 0;
canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchend', e => {
  if(!gameRunning) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > Math.abs(dy)){
    if(dx > 30) player.moveRight();
    else if(dx < -30) player.moveLeft();
  } else {
    if(dy < -30) player.jump();
    else if(dy > 30) player.slide();
  }
}, {passive:true});
</script>
</body>
</html>
